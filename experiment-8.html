<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Cards</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;  
    align-items: center;       
    height: 100vh;            
    background: white;
    font-family: Arial, sans-serif;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3em;
    padding: 20px;
    border: 2px solid black;
}

.card {
    width: 200px;
    background: rgb(245, 245, 245);
    border-radius: 12px;
    text-align: center;
    padding: 20px;
    box-shadow: 0px 4px 14px rgba(0, 0, 0, 0.15);
}

.circle {
    width: 70px;
    height: 70px;
    background: dodgerblue;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    font-weight: bold;
    font-size: 18px;
}
    </style>
</head>
<body>

    <div class="container">

        <div class="card">
            <div class="circle">JK</div>
            <h3>Jeet Kumar</h3>
            <p>B.Tech - CSE</p>
            <p>Roll No: 21CS1007</p>
            <p>1st Year</p>
        </div>

        <div class="card">
            <div class="circle">AR</div>
            <h3>Asha Rani</h3>
            <p>B.Tech - IT</p>
            <p>Roll No: 21IT1012</p>
            <p>1st Year</p>
        </div>

        <div class="card">
            <div class="circle">RK</div>
            <h3>Rohit Kumar</h3>
            <p>B.Tech - ECE</p>
            <p>Roll No: 21EC1009</p>
            <p>1st Year</p>
        </div>

    </div>

</body>
</html>
