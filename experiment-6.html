<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
  margin: 0;
  padding: 0;
  font-family: Arial;
}
.header {
  width: 100%;
  background: black;
  color: white;
  text-align: center;
  padding: 15px 0;
  font-size: 26px;
  font-weight: bold;
}
.outer-box {
  width: 80%;
  margin: 1px auto;
  padding: 10px;
}
.inner-box {
  width: 330px;
  background: black;
  border: 1px solid #cfcfcf;
  padding: 15px;
  margin: auto;
}
.product-img {
  display: block;
  width: 250px;
  height: 200px;
  object-fit: cover;
  margin: 0 auto 15px auto;
  border-bottom: 1px solid #ddd;
  padding-bottom: 10px;
}
.title {
  margin: 10px 0 5px 0;
  font-size: 15px;
  font-weight: bold;
}
.desc {
  font-size: 12px;
  color: #555;
  margin-bottom: 8px;
}
.price {
  font-size: 15px;
  color: green;
  font-weight: bold;
  margin-bottom: 12px;
}
.old-price {
  text-decoration: line-through;
  color: gray;
  font-size: 12px;
  margin-left: 4px;
}
.btn {
  width: 100%;
  padding: 8px 0;
  background: #0066d9;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
}
.btn:hover {
    
  background: #004fa8;
}
    </style>
  </head>
  <body>
    <div class="header">ShopEasy</div>
    <div class="outer-box">
      <div class="inner-box">
        <img src="shirts.jpg" class="product-img" />
        <h3 class="title">Classic Cotton T-Shirt</h3>
        <p class="desc">
          Soft, breathable cotton. Regular fit. Available in multiple colors.
        </p>
        <p class="price">₹799 <span class="old-price">₹1,499</span></p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </body>
</html>
